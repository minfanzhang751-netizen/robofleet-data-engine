# Consumer-group lag for Strimzi Kafka (danielqsj/kafka-exporter).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: observability
  labels:
    app: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.8.0
          args:
            - --kafka.server=robofleet-kafka-bootstrap.kafka.svc:9092
            - --web.listen-address=:9308
            - --topic.filter=robot-.*
            - --group.filter=robofleet-.*
          ports:
            - name: metrics
              containerPort: 9308
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: observability
  labels:
    app: kafka-exporter
spec:
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-exporter
  namespace: observability
  labels:
    app: kafka-exporter
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app: kafka-exporter
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
