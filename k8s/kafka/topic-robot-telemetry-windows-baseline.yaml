# Module 3 baseline window output (handwritten comparator; not fed to LLM).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: robot-telemetry-windows-baseline
  namespace: kafka
  labels:
    strimzi.io/cluster: robofleet
spec:
  partitions: 6
  replicas: 1
  config:
    retention.ms: "86400000"
    cleanup.policy: delete
