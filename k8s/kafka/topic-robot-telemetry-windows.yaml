# Module 3 primary window output (Spark → LLM client). Contract: docs/window-schema-v1.md
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: robot-telemetry-windows
  namespace: kafka
  labels:
    strimzi.io/cluster: robofleet
spec:
  partitions: 6
  replicas: 1
  config:
    retention.ms: "86400000"
    cleanup.policy: delete
