# LLM client: Spark windows → classified topic. CLASSIFIER=vllm calls the
# in-cluster vLLM Service. Unset CLASSIFIER to keep the Module 3 mock.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-client
  namespace: robofleet
  labels:
    app: llm-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-client
  template:
    metadata:
      labels:
        app: llm-client
    spec:
      containers:
        - name: llm-client
          image: robofleet-llm-client:local
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: robofleet-kafka-bootstrap.kafka.svc:9092
            - name: KAFKA_INPUT_TOPIC
              value: robot-telemetry-windows
            - name: KAFKA_OUTPUT_TOPIC
              value: robot-diagnostics-classified
            - name: KAFKA_GROUP_ID
              value: robofleet-llm-client
            - name: KAFKA_DLQ_TOPIC
              value: robot-diagnostics-dlq
            - name: CLASSIFIER
              value: vllm
            - name: VLLM_BASE_URL
              value: http://vllm.robofleet.svc:8000/v1
            - name: VLLM_MODEL
              value: Qwen/Qwen2.5-3B-Instruct
            - name: CLASSIFIER_MAX_ATTEMPTS
              value: "3"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
